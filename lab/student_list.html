<!DOCTYPE html>
<html lang="en">

<head>
  <title>Club Membership</title>

  <style>
    input {
      width: 100%;
      padding: 5px;
      margin: 5px 5px 5px 0px;
      box-sizing: border-box;

    }
  </style>

</head>

<body>

  <h1>Student Club Roster</h1>

  <h2>Add Students</h2>

  <label for="student-name">Student Name</label><input id="student-name" name="student-name">
  <br>
  <label for="student-id">Student ID</label><input id="student-id" name="student-id">
  <br>
  <label for="student-gpa">Student GPA</label><input id="student-gpa" name="student-gpa" type="number">
  <br>
  <button id="add-student">Add Student</button>

  <h2>Student List</h2>

  <p>There are
    <span id="student-count">
      <!-- use JavaScript to count the number of students, and show here -->
    </span>
    student(s) in the club.
  </p>

  <ul id="student-list">
    <!-- use JavaScript to create li elements  -->
  </ul>

  <script>
    // Get the elements from the page
    let nameInput = document.querySelector('#student-name')
    let idInput = document.querySelector('#student-id')
    let gpaInput = document.querySelector('#student-gpa')
    let addButton = document.querySelector('#add-student')
    let studentList = document.querySelector('#student-list')
    let studentCount = document.querySelector('#student-count')

    // Display the initial student count
    studentCount.innerHTML = 0

    // Add a student when the button is clicked
    addButton.addEventListener('click', function () {

      // Get the student's name
      let name = nameInput.value
      if (name == '') {
        alert('Please enter a student name')
        return
      }

      // Get the student's ID
      let id = idInput.value
      if (id == '') {
        alert('Please enter a student ID')
        return
      }

      // Get and validate the student's GPA
      let gpa = gpaInput.value
      if (gpa == '' || gpa < 0 || gpa > 4) {
        alert('Please enter a GPA between 0 and 4')
        return
      }

      // Create a new list item
      let listItem = document.createElement('li')

      // Add the student's information
      listItem.innerHTML = `Name:${name}, id: ${id}, GPA: ${gpa}`

      // Add the student to the list
      studentList.appendChild(listItem)

      // Clear the input fields
      nameInput.value = ''
      idInput.value = ''
      gpaInput.value = ''

      // Update the student count
      studentCount.innerHTML = studentList.children.length
    })



  </script>

</body>

</html>
